services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: launchops
      POSTGRES_PASSWORD: launchops
      POSTGRES_DB: launchops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchops -d launchops"]
      interval: 2s
      timeout: 5s
      retries: 10
