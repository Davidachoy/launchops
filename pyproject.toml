[project]
name = "launchops"
version = "0.1.0"
description = "FastAPI service for launch readiness and operational health checks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
